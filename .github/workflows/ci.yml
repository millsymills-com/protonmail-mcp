name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: mod verify
        run: go mod verify
      - name: gofmt
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            git ls-files -z '*.go' | xargs -0 gofmt -d
            exit 1
          fi
      - name: verify cassettes (scrub-leak scan)
        run: make verify-cassettes
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
      - name: unit tests + coverage threshold
        run: make coverage-check
      - name: integration tests
        run: go test -tags=integration ./... -race
