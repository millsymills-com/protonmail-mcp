repos:
  - repo: local
    hooks:
      - id: verify-cassettes
        name: verify cassettes are scrubbed
        entry: make verify-cassettes
        language: system
        pass_filenames: false
        files: '(?i)^.*testdata/cassettes/.*\.ya?ml$'

  - repo: local
    hooks:
      - id: claude-settings-guard
        name: Check staged Claude settings
        entry: python3 .github/security/check_claude_settings.py --staged
        language: system
        pass_filenames: false
        always_run: true
